<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고시가 계산기 | 더울림코퍼레이션</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<!--
  ⚠ 이 파일은 단일(self-contained) HTML 파일입니다.
  데이터(price-data.json 내용)와 스타일, 로직이 전부 이 파일 안에 내장되어 있어
  서버나 다른 파일 없이 더블클릭만으로 바로 사용할 수 있습니다.
  나중에 더울림코퍼레이션 홈페이지의 한 카테고리(서브페이지)로 옮길 때는
  <div id="app"> 이하 내용 + <style>/<script> 블록을 그대로 이식하면 됩니다.
  원본 고시가표(제지사별_고시가격_검색.html 등)가 갱신되면 DATA 배열만 재추출해서 교체해주세요.
-->
<style>
  :root {
    --navy: #1e3350; --navy-dark: #12213a; --navy-soft: #2c4a70;
    --green: #1f6b4d; --green-dark: #154a35; --green-soft: #e8f3ee;
    --bg: #f5f7f6; --card: #ffffff; --border: #e2e6ea; --text: #1f2530; --muted: #6b7684;
    --warn-bg: #fff9ec; --warn-border: #e0c46a; --warn-text: #7a5d10;
    --radius: 12px; --radius-sm: 8px; --max-w: 1100px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,
      'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  button, input, select { font-family: inherit; }
  .dash { color: #c3cad1; }

  /* ---- 헤더 ---- */
  .page-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-dark));
    color: #fff; padding: 32px 20px 0; text-align: center;
  }
  .page-header h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.4px; }
  .page-header p { margin: 0 0 20px; font-size: 13px; color: #cfd8e3; text-align: right; max-width: 780px; margin-left: auto; margin-right: auto; padding: 0 16px; box-sizing: border-box; }

  /* ---- 탭 ---- */
  .tabs { display: flex; gap: 6px; max-width: 780px; margin: 6px auto 0; padding: 0 16px; }
  .tab-btn {
    flex: 1; background: rgba(255,255,255,0.10); border: none; color: #cfd8e3;
    padding: 12px 10px; font-size: 16.5px; font-weight: 800; letter-spacing: -0.2px; cursor: pointer;
    border-radius: 12px 12px 0 0; border-bottom: 3px solid transparent;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab-btn.active { background: var(--bg); color: var(--navy); border-bottom-color: var(--green); }
  .tab-btn:not(.active):hover { background: rgba(255,255,255,0.2); color: #fff; }

  .tab-content { display: none; max-width: 780px; margin: 0 auto; padding: 24px 16px 60px; }
  .tab-content.active { display: block; }

  /* ---- 공용 패널 ---- */
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .panel-title { background: var(--navy); color: #fff; font-size: 14px; font-weight: 700; padding: 11px 16px; }
  .empty-box {
    background: var(--warn-bg); border: 1px dashed var(--warn-border); border-radius: var(--radius-sm);
    padding: 26px 18px; text-align: center; color: var(--warn-text); font-size: 13.5px; margin: 14px;
  }

  /* ================= 계산기 탭 (v4) ================= */
  .calc-wrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .section-label { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
  .step-badge {
    flex: none; width: 21px; height: 21px; border-radius: 50%; background: var(--navy); color: #fff;
    font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }

  .calc-block {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px;
  }
  .row-double { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 620px) { .row-double { grid-template-columns: 1fr; } }

  select, .text-input {
    width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 12px;
    font-size: 14.5px; background: #fafbfc; color: var(--text);
  }
  select:disabled, .text-input:disabled { opacity: 0.5; cursor: not-allowed; }

  .suggest-list {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm);
    max-height: 280px; overflow-y: auto; box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  }
  .suggest-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 12px; font-size: 13.5px; cursor: pointer; border-bottom: 1px solid #f0f2f4;
  }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:hover { background: var(--green-soft); }
  .suggest-item .s-name { font-weight: 600; color: var(--text); }
  .suggest-item .s-company { font-size: 11.5px; color: var(--muted); flex: none; }
  .suggest-empty { padding: 14px 12px; font-size: 12.5px; color: var(--muted); text-align: center; }

  #sel-color { margin-top: 8px; }

  /* 3) 규격 선택 — 1~2행: 프리셋 8개(4열 x 2행, 동일폭) */
  .size-grid { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 14px; row-gap: 7px; align-items: stretch; }
  @media (max-width: 560px) { .size-grid { grid-template-columns: 1fr 1fr; } }
  .preset-box {
    min-width: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fafbfc; color: var(--text);
    padding: 12px 8px; font-size: 13.5px; font-weight: 700; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .preset-sub { font-size: 10.5px; color: var(--muted); font-weight: 400; }
  .preset-box.active { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); }
  .preset-box:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }

  /* 3) 규격 선택 — 2행: 직접입력 (가로/세로 스테퍼 + 스왑 아이콘) */
  .dims-row-v2 { display: flex; align-items: flex-end; gap: 14px; margin-top: 14px; }
  @media (max-width: 480px) { .dims-row-v2 { flex-wrap: wrap; } }
  .dim-block { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .dim-title { font-size: 13.5px; font-weight: 700; color: var(--navy); }
  .dim-stepper {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    border: 1px solid var(--border); border-radius: var(--radius); background: #fff; padding: 8px 10px;
  }
  .dim-stepper:focus-within { border-color: var(--green); }
  .dim-stepper input[type=number] {
    flex: 1; min-width: 0; border: none; background: transparent; text-align: center;
    font-size: 15px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums;
  }
  .dim-stepper input[type=number]::placeholder { color: #b9c0c8; font-weight: 400; }
  .dim-stepper input[type=number]:focus { outline: none; }
  .step-btn {
    flex: none; width: 26px; height: 26px; border-radius: 0; border: none; background: none; color: var(--green);
    font-size: 20px; font-weight: 700; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .step-btn:hover { color: var(--green-dark); }
  .swap-col { flex: none; display: flex; align-items: center; justify-content: center; padding-bottom: 8px; }
  .swap-btn-v2 {
    border: none; background: none; cursor: pointer; color: var(--green); padding: 0;
    display: flex; flex-direction: column; align-items: center; line-height: 1; font-size: 15px; font-weight: 700;
  }
  .swap-btn-v2 span { display: block; }
  .swap-btn-v2:hover { color: var(--green-dark); }

  /* 5) 할인율: 전체폭 */
  .discount-flex { display: flex; align-items: center; gap: 10px; width: 100%; }
  .discount-flex input[type=number], .discount-flex input[type=text] {
    flex: 1; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 12px; font-size: 15px;
    font-variant-numeric: tabular-nums; text-align: center;
  }
  .pct-label { font-size: 15px; color: var(--muted); font-weight: 700; flex: none; }

  /* 결과 카드 (하단에 복사/공유 버튼 포함) */
  .result-card {
    background: linear-gradient(135deg, var(--navy), var(--green-dark)); color: #fff; border-radius: var(--radius);
    padding: 18px;
  }
  .result-card .r-title { font-size: 16px; font-weight: 700; }
  .result-card .r-sub { font-size: 12px; color: #cfe8db; margin-top: 2px; margin-bottom: 12px; }
  .result-divider { height: 1px; background: rgba(255,255,255,0.18); margin: 10px 0; }
  .result-line { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; padding: 3px 0; }
  .result-line .r-label { color: #cfe8db; }
  .result-line .r-value { font-variant-numeric: tabular-nums; font-weight: 600; }
  .result-line .r-value .unit { font-size: 11.5px; font-weight: 400; margin-left: 2px; color: #cfe8db; }
  /* 공급가: 폰트 크기는 할인율과 동일, 굵기만 강조 */
  .result-line.main .r-label { font-weight: 800; color: #fff; }
  .result-line.main .r-value { font-weight: 800; color: #fff; }
  .calc-basis {
    margin-top: 12px; padding: 12px 14px; font-size: 12.5px; color: #eaf3ee; line-height: 1.6;
    background: rgba(255,255,255,0.1); border-radius: var(--radius-sm);
  }
  .calc-basis .sub-line { display: block; margin-top: 4px; color: #cfe8db; }

  .result-placeholder {
    background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 26px 18px; text-align: center; color: var(--muted); font-size: 13px;
  }

  .result-actions { display: flex; gap: 14px; margin-top: 12px; }
  .result-actions button {
    flex: 1; border-radius: var(--radius-sm); padding: 13px 8px; font-size: 14px; font-weight: 700; cursor: pointer;
    border: none; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: filter .15s, transform .15s;
  }
  .result-actions button:hover { filter: brightness(1.05); }
  #copy-btn { background: #fff; color: var(--text); }
  #share-btn { background: var(--green); color: #fff; }
  .result-actions button.copied { background: var(--green-soft); color: var(--green-dark); }

  /* ================= 고시가표 탭 ================= */
  .company-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8.4px; }
  @media (max-width: 700px) { .company-row { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 420px) { .company-row { grid-template-columns: repeat(3, 1fr); } }
  .company-box {
    min-width: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fafbfc; color: var(--text);
    padding: 11px 4px; font-size: 13.5px; font-weight: 700; cursor: pointer; text-align: center;
  }
  .company-box.active { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); }

  .table-row-triple { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-top: 14px; }
  @media (max-width: 620px) { .table-row-triple { grid-template-columns: 1fr; } }
  .filter-label {
    font-size: 13.5px; color: var(--muted); font-weight: 700; text-align: center;
    padding-bottom: 6px; margin-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .table-row-triple select, .table-row-triple input[type=text] {
    width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px;
    font-size: 13.5px; background: #fafbfc; color: var(--text); text-align: center;
  }
  .table-row-triple select option { text-align: left; }

  .price-table-wrap { overflow: auto; max-height: 560px; border: 1px solid var(--border); border-radius: var(--radius); margin-top: 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  thead th {
    position: sticky; top: 0; background: var(--navy); color: #fff;
    text-align: center; padding: 9px 8px; font-weight: 600; z-index: 2; white-space: nowrap;
  }
  thead th.left { text-align: left; }
  tbody td { padding: 7px 8px; border-bottom: 1px solid #eef1f4; vertical-align: middle; }
  tbody tr:hover td { background: #f7fafc; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.name-cell { white-space: normal; max-width: 220px; font-weight: 600; text-align: left; }
  td.name-cell.cat-cell { font-weight: 400; }
  td.name-cell .scolor { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 400; }
</style>
</head>
<body>

<div class="page-header">
  <h1>고시가 정보</h1>
  <p>(주)더울림Corp. 26년 09월 기준</p>
  <div class="tabs">
    <button class="tab-btn active" data-tab="calc">고시가 계산기</button>
    <button class="tab-btn" data-tab="table">고시가표</button>
  </div>
</div>

<div id="tab-calc" class="tab-content active">
  <div class="calc-wrap" id="calc-wrap"></div>
</div>

<div id="tab-table" class="tab-content">
  <div class="calc-block">
    <div class="company-row" id="company-row"></div>
    <div class="table-row-triple">
      <div>
        <div class="filter-label">지종 검색</div>
        <input type="text" id="tf-series" placeholder="지종명을 입력해 검색하세요">
      </div>
      <div>
        <div class="filter-label">분류 검색</div>
        <select id="tf-category"><option value="">전체 분류</option></select>
      </div>
      <div>
        <div class="filter-label">평량 검색</div>
        <select id="tf-weight"><option value="">전체 평량</option></select>
      </div>
    </div>
  </div>
  <div class="price-table-wrap" id="price-table-wrap"></div>
</div>

<script>
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

function seriesDisplay(r){
  const c = r.color;
  const base = r.series.replace(/\n/g, '<br>');
  if(!c || c === '-') return { title: base, sub: '' };
  const cc = c.replace(/\n/g, '<br>');
  const m = /^\[(.+?)\]\s*([\s\S]*)$/.exec(cc);
  if(m) return { title: `${base} [${m[1]}]`, sub: m[2] };
  return { title: base, sub: cc };
}

let widthMM = 788, heightMM = 1091;
let discountPct = 0;
let discountMode = 'pct';       // 'pct' (할인율 입력 기준) | 'price' (할인가 입력 기준)
let discountPriceInput = null;  // 할인가 직접입력 값

const SIZE_PRESETS = [
  { key:'a', label:'788×1091', w:788, h:1091 },
  { key:'b', label:'636×939',  w:636, h:939 },
  { key:'c', label:'889×1194', w:889, h:1194 },
  { key:'d', label:'788×545',  w:788, h:545 },
  { key:'e', label:'788×1092', w:788, h:1092 },
  { key:'f', label:'640×940',  w:640, h:940 },
  { key:'g', label:'880×625',  w:880, h:625 },
  { key:'h', label:'394×545',  w:394, h:545 },
];
/* e/f는 각각 a/b의 산업 분류용 규격입니다 — 산업 분류 지종을 선택하면 기본값이 자동으로 e/f로 적용됩니다. */

/* 연당 중량(kg) = 가로(mm) × 세로(mm) × 평량(g/㎡) × 500매 ÷ 1,000,000,000 */
function reamWeightKg(w, h, gsm){
  if(!isNum(w) || !isNum(h) || !isNum(gsm)) return null;
  return w * h * gsm * 500 / 1000000000;
}

/* ============================================================
   UI 빌드 — 모든 선택 단계를 처음부터 한 번에 표시
   ============================================================ */
function buildCalculatorUI(){
  const wrap = document.getElementById('calc-wrap');
  wrap.innerHTML = `
    <div class="calc-block row-double">
      <div style="position:relative;">
        <div class="section-label"><span class="step-badge">1</span>지종 선택</div>
        <input type="text" id="series-search" class="text-input" placeholder="지종명을 입력해 검색하세요 (예: AB더블랑)" autocomplete="off">
        <div id="series-suggest" class="suggest-list"></div>
      </div>
      <div>
        <div class="section-label"><span class="step-badge">2</span>평량 선택</div>
        <select id="sel-weight" disabled><option value="">지종을 먼저 선택하세요</option></select>
        <select id="sel-color" style="display:none;"><option value="">색상 선택</option></select>
      </div>
    </div>

    <div class="calc-block" id="size-card">
      <div class="section-label"><span class="step-badge">3</span>규격 선택</div>
      <div id="size-body"></div>
    </div>

    <div class="calc-block row-double">
      <div>
        <div class="section-label"><span class="step-badge">4</span>할인율 입력</div>
        <div class="discount-flex">
          <input type="number" id="discount-input" min="0" step="0.5" placeholder="할인율을 입력하세요">
          <span class="pct-label">%</span>
        </div>
      </div>
      <div>
        <div class="section-label"><span class="step-badge">5</span>할인가 입력</div>
        <div class="discount-flex">
          <input type="text" inputmode="numeric" id="discount-price-input" placeholder="할인가를 입력하세요">
          <span class="pct-label">원</span>
        </div>
      </div>
    </div>

    <div id="result-slot"></div>
  `;

  const searchInput = document.getElementById('series-search');
  const suggestBox = document.getElementById('series-suggest');

  searchInput.addEventListener('input', ()=> renderSuggestions(searchInput.value));
  searchInput.addEventListener('focus', ()=> renderSuggestions(searchInput.value));
  document.addEventListener('click', (e)=>{
    if(!suggestBox.contains(e.target) && e.target !== searchInput){
      suggestBox.style.display = 'none';
    }
  });

  document.getElementById('discount-input').addEventListener('input', (e)=>{
    let v = parseFloat(e.target.value);
    if(isNaN(v)) v = 0;
    v = Math.max(0, v); // 상한 없음
    discountPct = v;
    discountMode = 'pct';
    const res = renderResult();
    const priceInput = document.getElementById('discount-price-input');
    if(res && priceInput && document.activeElement !== priceInput){
      priceInput.value = fmt(res.discR);
    }
  });

  document.getElementById('discount-price-input').addEventListener('input', (e)=>{
    const raw = e.target.value.replace(/[^0-9]/g, '');
    const v = raw === '' ? NaN : parseFloat(raw);
    discountPriceInput = isNaN(v) ? null : Math.max(0, v);
    discountMode = 'price';
    // 세자리 콤마 포맷 적용 (커서는 끝으로)
    e.target.value = discountPriceInput === null ? '' : discountPriceInput.toLocaleString('ko-KR');
    const res = renderResult();
    const pctInput = document.getElementById('discount-input');
    if(res && pctInput && document.activeElement !== pctInput){
      pctInput.value = res.pctDisplay;
    }
  });

  renderSizeSection();
  renderResult();
}

function renderSuggestions(rawQuery){
  const suggestBox = document.getElementById('series-suggest');
  const q = rawQuery.trim().toLowerCase();

  const seen = new Set();
  let matches = [];

  if(q === ''){
    // 검색어 없이 클릭: 산업/All-Pulp 지종만 고시가표에 나온 순서 그대로 표시 (정렬하지 않음)
    for(const r of DATA){
      if(r.category !== '산업' || r.subcategory !== 'All-Pulp') continue;
      const key = r.company + '|' + r.series;
      if(seen.has(key)) continue;
      seen.add(key);
      matches.push({ company:r.company, series:r.series, seriesFirstLine: r.series.split('\n')[0] });
    }
  } else {
    // 검색어 입력 시: 전체 지종 대상으로 매칭 후 가나다순 정렬
    for(const r of DATA){
      const key = r.company + '|' + r.series;
      if(seen.has(key)) continue;
      const seriesFirstLine = r.series.split('\n')[0];
      if(!seriesFirstLine.toLowerCase().includes(q) && !r.company.toLowerCase().includes(q)) continue;
      seen.add(key);
      matches.push({ company:r.company, series:r.series, seriesFirstLine });
    }
    matches.sort((a,b)=> a.seriesFirstLine.localeCompare(b.seriesFirstLine,'ko'));
  }

  matches = matches.slice(0, 40);

  if(matches.length === 0){
    suggestBox.innerHTML = `<div class="suggest-empty">검색 결과가 없습니다.</div>`;
    suggestBox.style.display = 'block';
    return;
  }

  suggestBox.innerHTML = matches.map((m,i)=>`
    <div class="suggest-item" data-i="${i}">
      <span class="s-name">${m.seriesFirstLine}</span>
      <span class="s-company">${m.company}</span>
    </div>`).join('');
  suggestBox.style.display = 'block';

  suggestBox.querySelectorAll('.suggest-item').forEach((el,i)=>{
    el.addEventListener('click', ()=>{
      const m = matches[i];
      selCompany = m.company;
      selSeries = m.series;
      document.getElementById('series-search').value = m.seriesFirstLine;
      suggestBox.style.display = 'none';
      populateWeights();
    });
  });
}

function populateWeights(){
  const weightSel = document.getElementById('sel-weight');
  const colorSel = document.getElementById('sel-color');

  selWeightRow = null;
  colorSel.style.display = 'none';

  if(!selSeries){
    weightSel.disabled = true;
    weightSel.innerHTML = '<option value="">지종을 먼저 선택하세요</option>';
    renderResult();
    return;
  }

  weightSel.disabled = false;
  const rows = DATA.filter(r=>r.company===selCompany && r.series===selSeries);
  const weights = [...new Set(rows.map(r=>r.weight))];
  weightSel.innerHTML = '<option value="">평량</option>' +
    weights.map(w=>`<option value="${w}">${w}${isNum(w)?'g/㎡':''}</option>`).join('');

  weightSel.onchange = ()=>{
    const wVal = weightSel.value;
    if(wVal === ''){ selWeightRow = null; colorSel.style.display='none'; onRowConfirmed(); return; }
    const matched = rows.filter(r=> String(r.weight) === wVal);
    if(matched.length > 1){
      colorSel.style.display = '';
      colorSel.innerHTML = '<option value="">색상 선택</option>' +
        matched.map((r,i)=>`<option value="${i}">${(r.color||'색상 미지정').replace(/\n/g,' / ')}</option>`).join('');
      colorSel.onchange = ()=>{
        const idx = colorSel.value;
        selWeightRow = idx==='' ? null : matched[Number(idx)];
        onRowConfirmed();
      };
      selWeightRow = null;
      onRowConfirmed();
    } else {
      colorSel.style.display = 'none';
      selWeightRow = matched[0] || null;
      onRowConfirmed();
    }
  };

  renderResult();
}

function onRowConfirmed(){
  if(selWeightRow){
    // 새 지종/평량이 확정되면 규격 기본값을 분류(산업 여부)에 맞춰 갱신 (a↔e, b↔f)
    const isIndustrial = selWeightRow.category === '산업';
    const defaultKey = isIndustrial ? 'e' : 'a';
    const preset = SIZE_PRESETS.find(p=>p.key===defaultKey);
    sizePreset = defaultKey;
    widthMM = preset.w; heightMM = preset.h;
    renderSizeSection();

    // 할인 입력 상태 초기화 (플레이스홀더 다시 노출)
    discountPct = 0;
    discountMode = 'pct';
    discountPriceInput = null;
    const pctInput = document.getElementById('discount-input');
    const priceInput = document.getElementById('discount-price-input');
    if(pctInput) pctInput.value = '';
    if(priceInput) priceInput.value = '';
  }
  renderResult();
}

/* ============================================================
   3) 규격 선택 — 1~2행: 프리셋 8개(4열x2행) / 3행: 직접입력(스테퍼)
   ============================================================ */
function renderSizeSection(){
  const body = document.getElementById('size-body');

  const presetBtns = SIZE_PRESETS.map(p=>`
    <div class="preset-box ${sizePreset===p.key?'active':''}" data-key="${p.key}" role="button" tabindex="0">
      ${p.label}
    </div>`).join('');

  body.innerHTML = `
    <div class="size-grid">${presetBtns}</div>
    <div class="dims-row-v2">
      <div class="dim-block">
        <div class="dim-title">가로(mm)</div>
        <div class="dim-stepper">
          <button type="button" class="step-btn" id="width-minus" aria-label="가로 감소">−</button>
          <input type="number" id="width-input" placeholder="mm" value="${widthMM ?? ''}">
          <button type="button" class="step-btn" id="width-plus" aria-label="가로 증가">+</button>
        </div>
      </div>
      <div class="swap-col">
        <button type="button" class="swap-btn-v2" id="swap-btn" title="가로/세로 바꾸기">
          <span>→</span><span>←</span>
        </button>
      </div>
      <div class="dim-block">
        <div class="dim-title">세로(mm)</div>
        <div class="dim-stepper">
          <button type="button" class="step-btn" id="height-minus" aria-label="세로 감소">−</button>
          <input type="number" id="height-input" placeholder="mm" value="${heightMM ?? ''}">
          <button type="button" class="step-btn" id="height-plus" aria-label="세로 증가">+</button>
        </div>
      </div>
    </div>
  `;

  body.querySelectorAll('.preset-box').forEach(btn=>{
    const activate = ()=>{
      const key = btn.dataset.key;
      if(sizePreset === key){
        // 이미 선택된 프리셋을 다시 누르면 선택 해제 (가로/세로 0 → 결과에는 톤당가격 표시)
        sizePreset = 'none';
        widthMM = 0;
        heightMM = 0;
      } else {
        const p = SIZE_PRESETS.find(p=>p.key===key);
        sizePreset = p.key;
        widthMM = p.w;
        heightMM = p.h;
      }
      renderSizeSection(); renderResult();
    };
    btn.addEventListener('click', activate);
    btn.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); activate(); } });
  });

  const widthInput = document.getElementById('width-input');
  const heightInput = document.getElementById('height-input');
  const clearPreset = ()=>{ sizePreset = 'custom'; body.querySelectorAll('.preset-box').forEach(b=>b.classList.remove('active')); };

  widthInput.addEventListener('input', (e)=>{
    widthMM = parseFloat(e.target.value); if(isNaN(widthMM)) widthMM = null;
    clearPreset(); renderResult();
  });
  heightInput.addEventListener('input', (e)=>{
    heightMM = parseFloat(e.target.value); if(isNaN(heightMM)) heightMM = null;
    clearPreset(); renderResult();
  });
  document.getElementById('width-minus').addEventListener('click', ()=>{
    widthMM = Math.max(1, (isNum(widthMM)?widthMM:0) - 1);
    clearPreset(); widthInput.value = widthMM; renderResult();
  });
  document.getElementById('width-plus').addEventListener('click', ()=>{
    widthMM = (isNum(widthMM)?widthMM:0) + 1;
    clearPreset(); widthInput.value = widthMM; renderResult();
  });
  document.getElementById('height-minus').addEventListener('click', ()=>{
    heightMM = Math.max(1, (isNum(heightMM)?heightMM:0) - 1);
    clearPreset(); heightInput.value = heightMM; renderResult();
  });
  document.getElementById('height-plus').addEventListener('click', ()=>{
    heightMM = (isNum(heightMM)?heightMM:0) + 1;
    clearPreset(); heightInput.value = heightMM; renderResult();
  });
  document.getElementById('swap-btn').addEventListener('click', ()=>{
    const t = widthMM; widthMM = heightMM; heightMM = t;
    clearPreset();
    renderSizeSection(); renderResult();
  });
}

/* ============================================================
   계산
   ============================================================ */
function computeSheet(){
  const r = selWeightRow;
  const pton = isNum(r.pton) ? r.pton : null;
  if(!isNum(pton)) return { error:'톤당 단가 정보가 없어 계산할 수 없습니다.' };

  // 규격이 선택 해제된 상태(가로/세로 0): 톤당가격을 그대로 결과로 표시
  if(!widthMM || !heightMM){
    const basePrice = pton;
    let pct, disc;
    if(discountMode === 'price' && isNum(discountPriceInput)){
      disc = discountPriceInput;
      pct = basePrice > 0 ? (1 - disc/basePrice) * 100 : 0;
    } else {
      pct = discountPct;
      disc = basePrice * (1 - pct/100);
    }
    return {
      unit: '원/톤',
      price: basePrice,
      discounted: disc,
      effectivePct: pct,
      basisLine: `규격 미선택 · 톤당 단가 기준`,
    };
  }

  const gsm = isNum(r.weight) ? r.weight : null;
  const wKg = reamWeightKg(widthMM, heightMM, gsm);
  if(!isNum(wKg)) return { error:'가로/세로/평량 값을 확인해 주세요.' };

  // 4×6(788×1091/1092) · 국판(636×939/640×940) 표준 규격이고
  // 고시가표에 실제 등재된 가격(p4x6/pgj)이 있으면 그 값을 그대로 사용 (환산값 대신 실측값 우선)
  const is46 = (widthMM===788 && heightMM===1091) || (widthMM===788 && heightMM===1092);
  const isGukpan = (widthMM===636 && heightMM===939) || (widthMM===640 && heightMM===940);
  let price, basisLine;

  if(is46 && isNum(r.p4x6)){
    price = r.p4x6;
    basisLine = `${widthMM}×${heightMM}mm · 고시가표 4×6 등재가 기준 (톤당가 환산 시 ${fmt(Math.round(wKg*pton/1000))}원)`;
  } else if(isGukpan && isNum(r.pgj)){
    price = r.pgj;
    basisLine = `${widthMM}×${heightMM}mm · 고시가표 국판 등재가 기준 (톤당가 환산 시 ${fmt(Math.round(wKg*pton/1000))}원)`;
  } else {
    price = wKg * pton / 1000;              // 원/연 — 표에 등재되지 않은 규격은 톤당가로 환산
    basisLine = `${widthMM}×${heightMM}mm · 연당 ${wKg.toLocaleString('ko-KR',{maximumFractionDigits:2})}kg × ${fmt(pton)}원/톤 기준 환산`;
  }

  let effectivePct, discounted;

  if(discountMode === 'price' && isNum(discountPriceInput)){
    // 할인가를 직접 입력한 경우: 그 값을 공급가로 쓰고, 할인율은 역산
    discounted = discountPriceInput;
    effectivePct = price > 0 ? (1 - discounted/price) * 100 : 0;
  } else {
    effectivePct = discountPct;
    discounted = price * (1 - effectivePct/100);
  }

  return { unit:'원/연', price, discounted, effectivePct, basisLine };
}

function renderResult(){
  const slot = document.getElementById('result-slot');

  if(!selWeightRow){
    slot.innerHTML = `<div class="result-placeholder">지종과 평량을 선택하면 계산 결과가 표시됩니다.</div>`;
    return null;
  }

  const res = computeSheet();
  const r = selWeightRow;

  if(res.error){
    slot.innerHTML = `<div class="empty-box">${res.error}</div>`;
    return null;
  }

  const priceR = Math.round(res.price);
  const discR = Math.round(res.discounted);
  const pctDisplay = Math.round(res.effectivePct * 100) / 100; // 소수 2자리
  const seriesName = r.series.replace(/\n/g,' ');
  const colorTxt = r.color ? r.color.replace(/\n/g,' / ') : '';

  slot.innerHTML = `
    <div class="result-card">
      <div class="r-title">${seriesName}</div>
      <div class="r-sub">${r.company} · ${r.category}${colorTxt ? ' · '+colorTxt : ''} · 평량 ${r.weight}g/㎡ · ${(widthMM && heightMM) ? `규격 ${widthMM}×${heightMM}mm` : '규격 미선택'}</div>

      <div class="result-line">
        <span class="r-label">고시가</span>
        <span class="r-value">${fmt(priceR)}<span class="unit">${res.unit}</span></span>
      </div>
      <div class="result-line">
        <span class="r-label">할인율</span>
        <span class="r-value">${pctDisplay}<span class="unit">%</span></span>
      </div>
      <div class="result-divider"></div>
      <div class="result-line main">
        <span class="r-label">공급가</span>
        <span class="r-value">${fmt(discR)}<span class="unit">${res.unit}</span></span>
      </div>

      <div class="calc-basis">${res.basisLine}</div>

      <div class="result-actions">
        <button id="copy-btn">📋 복사</button>
        <button id="share-btn">🔗 공유</button>
      </div>
    </div>
  `;

  document.getElementById('copy-btn').addEventListener('click', ()=>copyOrShare('copy'));
  document.getElementById('share-btn').addEventListener('click', ()=>copyOrShare('share'));

  return { ...res, priceR, discR, pctDisplay };
}

function buildSummaryText(){
  const r = selWeightRow;
  const res = computeSheet();
  if(res.error) return null;
  const pctDisplay = Math.round(res.effectivePct * 100) / 100;
  const pctText = Number.isInteger(pctDisplay) ? pctDisplay : pctDisplay.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
  const seriesName = r.series.replace(/\n/g,' ');
  return [
    `[더울림 Corp.]`,
    seriesName,
    `${r.weight}g ${(widthMM && heightMM) ? `${widthMM}×${heightMM}mm` : '규격 미선택(톤당가)'}`,
    `고시가 ${Math.round(res.price).toLocaleString('ko-KR')}${res.unit}`,
    `공급가 ${Math.round(res.discounted).toLocaleString('ko-KR')}${res.unit} (${pctText}%)`,
  ].join('\n');
}

function copyOrShare(action){
  const text = buildSummaryText();
  if(!text) return;
  const btn = document.getElementById(action==='copy' ? 'copy-btn' : 'share-btn');
  const orig = btn.textContent;
  const flash = (label)=>{
    btn.textContent = label; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  };
  if(action === 'share' && navigator.share){
    navigator.share({ title:'고시가 계산 결과', text }).catch(()=>{});
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>flash('✅ 복사됨')).catch(()=>flash('복사 실패'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); flash('✅ 복사됨'); } catch(e){ flash('복사 실패'); }
    document.body.removeChild(ta);
  }
}



/* ============================================================
   [탭 2] 고시가표
   ============================================================ */
const COMPANY_ORDER = ['전체', '한솔', '무림', '한국', '삼화', '한창', '깨끗한나라'];
let tfCompanySel = null; // 초기 화면: 아무 제지사도 선택되지 않은 상태

function buildPriceTableUI(){
  const companyRow = document.getElementById('company-row');
  companyRow.innerHTML = COMPANY_ORDER.map(c=>`
    <div class="company-box ${c===tfCompanySel?'active':''}" data-company="${c}" role="button" tabindex="0">${c}</div>
  `).join('');
  companyRow.querySelectorAll('.company-box').forEach(box=>{
    const activate = ()=>{
      const clickedCompany = box.dataset.company;
      if(tfCompanySel === clickedCompany){
        // 이미 선택된 제지사를 다시 클릭하면 선택 해제
        tfCompanySel = null;
      } else {
        tfCompanySel = clickedCompany;
      }
      companyRow.querySelectorAll('.company-box').forEach(b=>b.classList.toggle('active', b.dataset.company === tfCompanySel));
      renderPriceTable();
    };
    box.addEventListener('click', activate);
    box.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); activate(); } });
  });

  // 분류 드롭다운: 대분류/소분류 조합 목록 (필터 검색 방식 — 텍스트 입력 아님)
  const catSel = document.getElementById('tf-category');
  const seenCat = new Set();
  const combos = [];
  DATA.forEach(r=>{
    const key = r.category + '|' + (r.subcategory||'');
    if(seenCat.has(key)) return;
    seenCat.add(key);
    combos.push({ category: r.category, subcategory: r.subcategory || '' });
  });
  combos.sort((a,b)=> (a.category+a.subcategory).localeCompare(b.category+b.subcategory, 'ko'));
  catSel.innerHTML = '<option value="">전체 분류</option>' +
    combos.map(c=>{
      const val = c.category + '|' + c.subcategory;
      const label = c.subcategory ? `${c.category} / ${c.subcategory}` : c.category;
      return `<option value="${val}">${label}</option>`;
    }).join('');

  // 평량 드롭다운: 데이터에 등장하는 평량 값 전체 (숫자 오름차순, 비숫자는 뒤에)
  const weightSel = document.getElementById('tf-weight');
  const seenW = new Set();
  const weights = [];
  DATA.forEach(r=>{
    const w = r.weight;
    if(w === null || w === undefined) return;
    const key = String(w);
    if(seenW.has(key)) return;
    seenW.add(key);
    weights.push(w);
  });
  weights.sort((a,b)=>{
    const an = isNum(a), bn = isNum(b);
    if(an && bn) return a - b;
    if(an) return -1;
    if(bn) return 1;
    return String(a).localeCompare(String(b), 'ko');
  });
  weightSel.innerHTML = '<option value="">전체 평량</option>' +
    weights.map(w=>`<option value="${w}">${w}${isNum(w)?'g/㎡':''}</option>`).join('');

  catSel.addEventListener('change', renderPriceTable);
  document.getElementById('tf-series').addEventListener('input', renderPriceTable);
  weightSel.addEventListener('change', renderPriceTable);

  renderPriceTable();
}

function renderPriceTable(){
  const catVal = document.getElementById('tf-category').value;
  const seriesQ = document.getElementById('tf-series').value.trim().toLowerCase();
  const weightVal = document.getElementById('tf-weight').value;

  const wrap = document.getElementById('price-table-wrap');
  const tableHead = `<thead><tr>
      <th class="left">제지사 · 지종</th>
      <th class="left">분류</th>
      <th>평량(g/㎡)</th>
      <th>4×6(원)</th>
      <th>국판(원)</th>
      <th>톤당(원)</th>
    </tr></thead>`;

  // 제지사를 아무것도 선택하지 않은 초기 상태: 표 헤더만 표시
  if(tfCompanySel === null){
    wrap.innerHTML = `<table>${tableHead}<tbody></tbody></table>`;
    return;
  }

  let filtered = DATA.filter(r=>{
    if(tfCompanySel !== '전체' && r.company !== tfCompanySel) return false;
    if(catVal){
      const key = r.category + '|' + (r.subcategory||'');
      if(key !== catVal) return false;
    }
    if(seriesQ){
      const hay = `${r.series} ${r.color||''}`.toLowerCase();
      if(!hay.includes(seriesQ)) return false;
    }
    if(weightVal){
      if(String(r.weight ?? '') !== weightVal) return false;
    }
    return true;
  });

  if(filtered.length===0){
    wrap.innerHTML = `<table>${tableHead}<tbody></tbody></table>`;
    return;
  }

  let body = '';
  filtered.forEach(r=>{
    const disp = seriesDisplay(r);
    const sub = disp.sub ? `<span class="scolor">${disp.sub}</span>` : '';
    const catTxt = r.subcategory ? `${r.category} / ${r.subcategory}` : r.category;
    body += `<tr>
      <td class="name-cell">${r.company} · ${disp.title}${sub}</td>
      <td class="name-cell cat-cell">${catTxt}</td>
      <td class="num">${r.weight ?? '<span class="dash">-</span>'}</td>
      <td class="num">${fmt(r.p4x6)}</td>
      <td class="num">${fmt(r.pgj)}</td>
      <td class="num">${fmt(r.pton)}</td>
    </tr>`;
  });

  wrap.innerHTML = `<table>${tableHead}<tbody>${body}</tbody></table>`;
}

/* ============================================================
   초기화
   ============================================================ */
buildCalculatorUI();
buildPriceTableUI();
</script>
