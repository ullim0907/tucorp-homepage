<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사업영역 | 더울림코퍼레이션</title>
<style>
  :root {
    --navy-900: #0a1930;
    --paper-bg: #f6f4ee;
    --ink-600: #565f6f;
    --paper-line: #e4e1d6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--paper-bg);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    color: var(--navy-900);
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 12px;
  }
  p {
    color: var(--ink-600);
    margin: 0 0 28px;
  }
  .links {
    display: flex;
    gap: 12px;
  }
  a.btn {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 2px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--navy-900);
  }
  a.btn.primary {
    background: var(--navy-900);
    color: #fff;
  }
  a.btn.ghost {
    color: var(--navy-900);
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>사업영역</h1>
  <p>페이지 준비 중입니다.</p>
  <div class="links">
    <a href="../고시가정보/index.html" class="btn primary">고시가 정보</a>
    <a href="../index.html" class="btn ghost">홈으로</a>
  </div>
</div>

</body>
</html>
